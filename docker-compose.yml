version: '3.8'

services:

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: medical_ai_db
    environment:
      POSTGRES_DB: medical_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis Cache & Celery Broker ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: medical_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Ollama — Local LLM Server (MedGemma 4B) ────────────────────────────────
  # After first `docker compose up`, pull the model once:
  #   docker compose exec ollama ollama pull medgemma
  ollama:
    image: ollama/ollama:latest
    container_name: medical_ai_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  # ── Django REST API Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_ai_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn medical_ai_backend.wsgi:application
               --bind 0.0.0.0:8000
               --workers 4
               --timeout 600
               --graceful-timeout 30
               --keep-alive 5"
    volumes:
      - ./backend:/app
      # ML source code — REPO_ROOT is Path(BASE_DIR).parent = /
      # so `import src.models…` resolves from /src
      - ./src:/src
      # Model weights — accessible at both:
      #   /models/checkpoints/experts/  (REPO_ROOT/models, used by expert_dir)
      #   /app/models/checkpoints/      (BASE_DIR/models, used by ckpt_path)
      - ./models:/models
      - ./models:/app/models
      - media_files:/app/media
      - static_files:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/medical_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── Celery Worker — Async ML Inference Tasks ────────────────────────────────
  # Runs inference in the background so HTTP requests return immediately (202).
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical_ai_celery_worker
    command: celery -A medical_ai_backend worker -l info --concurrency=2
    volumes:
      - ./backend:/app
      - ./src:/src
      - ./models:/models
      - ./models:/app/models
      - media_files:/app/media
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/medical_ai_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_URL=http://ollama:11434/api/generate
    depends_on:
      - db
      - redis
      - backend
      - ollama
    restart: unless-stopped

  # ── React Frontend (production build, served by Nginx) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the JS bundle at build time — use your real domain
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
    container_name: medical_ai_frontend
    expose:
      - "80"
    restart: unless-stopped

  # ── Nginx — Reverse Proxy + SSL Termination ─────────────────────────────────
  # Handles HTTPS, routes /api/ → backend, / → frontend container
  # SSL certs are mounted from the host (generated by Certbot)
  nginx:
    image: nginx:alpine
    container_name: medical_ai_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_files:/app/static:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_files:
  static_files:
  ollama_data:

networks:
  default:
    name: medical_ai_network
