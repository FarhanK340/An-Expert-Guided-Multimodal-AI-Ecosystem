# =============================================================================
# docker/nginx/nginx.conf — Production Nginx Reverse Proxy
#
# Traffic flow:
#   Browser → Nginx :443 (SSL)
#     ├── /          → frontend container :80  (React SPA, built by Vite)
#     ├── /api/      → backend container :8000 (Django Gunicorn)
#     ├── /admin/    → backend container :8000
#     ├── /static/   → backend container :8000 (Django staticfiles)
#     └── /health/   → backend container :8000
#
# SSL: Let's Encrypt certs (Certbot) mounted from /etc/letsencrypt on host.
# Large uploads: NIfTI MRI files up to 1 GB.
# Long timeouts: ML inference can take several minutes.
# =============================================================================

upstream django {
    server backend:8000;
    keepalive 32;
}

upstream react {
    server frontend:80;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name medai-fydp.duckdns.org;

    # Let's Encrypt ACME challenge (for cert renewal — no redirect here)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Main Server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name medai-fydp.duckdns.org;

    # ── SSL ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/medai-fydp.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medai-fydp.duckdns.org/privkey.pem;
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           DENY always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Upload size (NIfTI files up to 1 GB) ─────────────────────────────────
    client_max_body_size 1G;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── React SPA (served by the frontend container) ──────────────────────────
    location / {
        proxy_pass         http://react;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django REST API ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Generous timeouts — inference can take several minutes
        proxy_read_timeout    600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;
    }

    # ── Django Admin ──────────────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Django Static files (admin CSS/JS) ────────────────────────────────────
    location /static/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Health check (unauthenticated, no access log) ─────────────────────────
    location /health/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        access_log off;
    }
}
