# React SPA routing config for the frontend Nginx stage (frontend/nginx.conf)
# This is used inside the frontend Docker image to serve the Vite build.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # For React Router — always fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (hashed filenames) aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
